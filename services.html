<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Услуги и цены — салон красоты «Кристалл», Люберцы</title>
<meta name="description" content="Прайс салона «Кристалл» в Люберцах: косметология, маникюр и педикюр, шугаринг, массаж, коррекция фигуры, абонементы.">
<meta name="theme-color" content="#11100f">
<link rel="icon" href="assets/images/logo-kristall.jpg">
<style>
:root{--bg:#11100f;--panel:#211b17;--ink:#f2ede5;--muted:#b8aa98;--gold:#c5a46d;--gold-hi:#f0d59b;--line:#493a2b;--line-soft:#604b35;--serif:Georgia,serif;--sans:Arial,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);
background-image:radial-gradient(circle at 12% 10%,rgba(130,92,48,.18),transparent 28%),radial-gradient(circle at 88% 18%,rgba(76,58,42,.22),transparent 30%),radial-gradient(circle at 62% 88%,rgba(107,73,43,.14),transparent 28%);background-attachment:fixed;overflow-x:clip}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.site{max-width:1360px;margin:auto;padding:0 34px}
.label{font-size:12px;color:var(--gold);letter-spacing:.2em;text-transform:uppercase}

/* шапка (одинаковая на всех страницах) */
.top{position:sticky;top:0;z-index:30;height:86px;display:flex;align-items:center;justify-content:space-between;gap:20px;background:rgba(17,16,15,.96);border-bottom:1px solid var(--line)}
.logo{display:block;width:72px;height:72px}
.logo img{display:block;width:100%;height:100%;object-fit:contain}
.nav{display:flex;gap:28px;font-size:14px}
.nav a{padding:8px 0}
.nav a:hover,.nav a[aria-current="page"]{color:var(--gold)}
.cta{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:12px 22px;background:var(--gold);color:#171310;border:1px solid var(--gold-hi);border-radius:2px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 5px 20px rgba(197,164,109,.3);transition:background .2s,transform .2s}
.cta:hover{background:var(--gold-hi);transform:translateY(-1px)}

/* заголовок страницы */
.intro{padding:92px 9% 58px;border-bottom:1px solid var(--line)}
.intro h1{font:400 clamp(44px,8vw,112px)/.92 var(--serif);letter-spacing:-.06em;margin:20px 0}
.intro p{max-width:520px;color:var(--muted);font-size:17px;line-height:1.8;margin:0}

/* услуги */
.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 70px;align-items:start;padding:70px 9%;border-bottom:1px solid var(--line)}
.group{padding:25px 18px;background:var(--panel);border:1px solid var(--line-soft)}
.group h2{margin:0}
.group-toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:0;border:0;background:transparent;color:var(--ink);font:400 30px/1.15 var(--serif);text-align:left;cursor:pointer;transition:color .2s}
.group-toggle:hover{color:var(--gold)}
.group-toggle::after{content:'+';flex:none;font:400 28px var(--sans);color:#d2ad70}
.group.open .group-toggle::after{content:'−'}
.group-items{display:none;padding-top:20px}
.group.open .group-items{display:block}
.item{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.item span{color:#e5d8c7}
.item b{color:#e5d8c7;font-weight:600;white-space:nowrap}

/* отзывы */
.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;padding:70px 9%;border-bottom:1px solid var(--line)}
.review{padding:22px;background:var(--panel);border:1px solid var(--line-soft);border-top:1px solid var(--gold)}
.stars{color:var(--gold);letter-spacing:4px}
.review p{font:22px/1.5 var(--serif);min-height:170px;color:var(--muted);margin:16px 0}
.review strong{font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.note{padding:55px 9%;color:var(--muted);margin:0}
.note a{color:var(--gold);border-bottom:1px solid var(--gold)}

/* контакты */
.contacts{display:grid;grid-template-columns:.75fr 1.25fr;gap:70px;padding:70px 9%;border-bottom:1px solid var(--line)}
.details{padding:24px;background:var(--panel);border:1px solid var(--line-soft);align-self:start}
.details h2{font:400 35px var(--serif);margin:0 0 20px}
.details p{color:var(--muted);line-height:2;margin:0 0 14px}
.details a{color:var(--ink);border-bottom:1px solid var(--gold)}
.details a:hover{color:var(--gold)}
.map{display:block;width:100%;height:420px;border:0;background:var(--panel)}

footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:28px 0;color:var(--muted);font-size:13px}
footer a:hover{color:var(--gold-hi)}

/* планшет */
@media(max-width:850px){
.site{padding:0 20px}
.intro{padding:60px 0 40px}
.groups,.reviews,.contacts{grid-template-columns:1fr;padding:50px 0}
.contacts{gap:30px}
.review p{min-height:0}
.note{padding:40px 0}
}

/* телефон */
@media(max-width:560px){
body{background-attachment:scroll}
.top{height:auto;margin:0 -20px;padding:10px 20px 0;flex-wrap:wrap;row-gap:0;background:#11100f}
.logo{width:48px;height:48px}
.logo img{border-radius:8px}
.nav{order:3;width:100%;justify-content:space-between;gap:8px;margin-top:10px;border-top:1px solid var(--line);font-size:14px}
.nav a{padding:12px 4px}
.nav a:first-child{padding-left:0}
.nav a:last-child{padding-right:0}
.cta{padding:10px 18px;min-height:40px;font-size:11px;box-shadow:none}
.intro h1{font-size:clamp(40px,12.5vw,56px)}
.group{padding:20px 16px}
.group-toggle{font-size:24px}
.item{font-size:14px;gap:14px}
.map{height:320px}
footer{flex-direction:column}
}

@media(prefers-reduced-motion:reduce){
html{scroll-behavior:auto}
.cta,.group-toggle{transition:none}
}
</style>
</head>
<body>

<header class="top">
<a class="logo" href="index.html" aria-label="Кристалл — на главную"><img src="assets/images/logo-kristall.jpg" alt="Кристалл — студия косметологии и эстетики тела" width="72" height="72"></a>
<nav class="nav" aria-label="Основное меню">

const root=document.getElementById('price');
categories.forEach(([title,items],index)=>{
